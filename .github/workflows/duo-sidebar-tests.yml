name: Duo sidebar tests
on:
  push:
    branches: [ci/pr-duo-three-column, ci/pr-duo-search-columns]
permissions:
  contents: read
jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Duo host tests
        run: |
          status=0
          for test_script in tests/run_duo_*_tests.sh tests/run_native_search_overlay_return_tests.sh tests/run_classic_bar_theme_regression_check.sh; do
            echo "::group::$test_script"
            sh "$test_script" || { echo "FAILED: $test_script"; status=1; }
            echo "::endgroup::"
          done
          exit $status
